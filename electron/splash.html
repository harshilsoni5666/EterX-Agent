<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EterX</title>
  <script>
    var params = new URLSearchParams(window.location.search);
    var theme = params.get('theme') === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-splash-backdrop', params.get('backdrop') === 'native' ? 'native' : 'solid');
    document.documentElement.style.colorScheme = theme;
  </script>
  <link rel="stylesheet" href="splash.css" />
</head>
<body>
  <main class="eterx-startup" aria-label="Starting EterX" aria-busy="true">
    <div class="eterx-startup-drag" aria-hidden="true"></div>
    <div class="eterx-startup-content">
      <img id="splash-logo" class="eterx-startup-logo" alt="" draggable="false" />
      <h1 class="eterx-startup-title">Welcome to EterX</h1>
      <div class="eterx-startup-status" role="status"><span class="eterx-startup-spinner"></span><span>Loading EterX</span></div>
    </div>
    <button id="reload-app" class="eterx-startup-reload" type="button" hidden>Reload app</button>
  </main>
  <script>
    document.getElementById('splash-logo').src = params.get('icon') || '';
    var reloadButton = document.getElementById('reload-app');
    if (params.get('recovery') === 'true') reloadButton.hidden = false;
    else setTimeout(function () { reloadButton.hidden = false; }, 15000);
    reloadButton.addEventListener('click', async function () {
      reloadButton.disabled = true;
      reloadButton.textContent = 'Reloading…';
      try {
        await window.electronAPI.reloadApp();
      } catch (error) {
        console.error('[Startup] Reload failed:', error);
      } finally {
        reloadButton.disabled = false;
        reloadButton.textContent = 'Reload app';
      }
    });
  </script>
</body>
</html>
