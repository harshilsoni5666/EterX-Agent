<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EterX</title>
  <script>
    var params = new URLSearchParams(window.location.search);
    var theme = params.get('theme') === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
  </script>
  <link rel="stylesheet" href="splash.css" />
</head>
<body>
  <main class="eterx-startup" role="status" aria-label="Starting EterX" aria-busy="true">
    <div class="eterx-startup-drag" aria-hidden="true"></div>
    <div class="eterx-startup-content" aria-hidden="true">
      <img id="splash-logo" class="eterx-startup-logo" alt="" draggable="false" />
      <h1 class="eterx-startup-title">Welcome to EterX</h1>
      <div class="eterx-startup-status"><span class="eterx-startup-spinner"></span><span>Starting workspace</span></div>
      <p class="eterx-startup-caption">Preparing your agent environment</p>
    </div>
  </main>
  <script>document.getElementById('splash-logo').src = params.get('icon') || '';</script>
</body>
</html>
