name: eterx-telemetry

x-service: &service
  image: eterx-telemetry:local
  build:
    context: ..
    dockerfile: telemetry/Dockerfile
  restart: unless-stopped
  init: true
  read_only: true
  stop_grace_period: 30s
  depends_on:
    postgres:
      condition: service_healthy

x-database: &database
  PGHOST: postgres
  PGUSER: eterx
  PGDATABASE: telemetry
  PGPASSWORD: ${ETERX_TELEMETRY_DB_PASSWORD:?Set ETERX_TELEMETRY_DB_PASSWORD}

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: eterx
      POSTGRES_DB: telemetry
      POSTGRES_PASSWORD: ${ETERX_TELEMETRY_DB_PASSWORD:?Set ETERX_TELEMETRY_DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eterx -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 15

  receiver:
    <<: *service
    environment:
      <<: *database
      TELEMETRY_HOST: 0.0.0.0
      TELEMETRY_ADMIN_TOKEN: ${ETERX_TELEMETRY_ADMIN_TOKEN:?Set ETERX_TELEMETRY_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:4319:4319"

  rollup:
    <<: *service
    command: ["node", "worker.mjs"]
    environment: *database

volumes:
  postgres:
