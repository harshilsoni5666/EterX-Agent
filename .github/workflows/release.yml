name: Native release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: eterx-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: Require a public updater host
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "EterX desktop clients use an unauthenticated GitHub Releases feed; the repository is private, not PUBLIC." >&2
            exit 1
          fi
          if [ "$REPOSITORY_PRIVATE" != "false" ]; then
            echo "Could not determine repository visibility from the GitHub event." >&2
            exit 1
          fi

      - name: Check out release source
        id: source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Set up Node.js for release notes
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Prepare customer release notes
        run: |
          node --input-type=commonjs - <<'NODE'
          const expected = process.env.RELEASE_TAG.replace(/^v/, '');
          const { version } = require('./package.json');
          const lockfile = require('./package-lock.json');
          if (version !== expected || lockfile.version !== expected || lockfile.packages?.['']?.version !== expected) {
            throw new Error(`The package and lockfile versions must match ${process.env.RELEASE_TAG}.`);
          }
          NODE
          node scripts/prepare-release-notes.mjs "$RUNNER_TEMP/eterx-release-notes.md"

      - name: Create or reset draft release
        shell: bash
        run: |
          set -euo pipefail
          if draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null)"; then
            is_draft="$(jq -r '.isDraft' <<< "$draft")"
            if [ "$is_draft" != "true" ]; then
              echo "Release $RELEASE_TAG already exists and is published; published releases are immutable." >&2
              exit 1
            fi
            while IFS= read -r asset; do
              [ -z "$asset" ] || gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done < <(jq -r '.assets[].name' <<< "$draft")
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file "$RUNNER_TEMP/eterx-release-notes.md"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "EterX $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/eterx-release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" release-notes.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  verify:
    name: Verify release tests
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --fund=false

      - name: Validate release configuration
        run: npm run check:release-config

      - name: Run release checks
        run: npm run test:ci

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            target: win
            runtime_targets: win32:x64,win32:arm64
          - platform: macOS
            runner: macos-15
            target: mac
            runtime_targets: darwin:x64,darwin:arm64
          - platform: Linux
            runner: ubuntu-22.04
            target: linux
            runtime_targets: linux:x64,linux:arm64
    runs-on: ${{ matrix.runner }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      # Public releases are intentionally unsigned. Keep electron-builder from
      # auto-discovering a developer certificate on hosted runners.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ETERX_RUNTIME_TARGETS: ${{ matrix.runtime_targets }}
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://mirrors.huaweicloud.com/electron-builder-binaries/

    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --fund=false

      - name: Install Linux native toolchains
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Compile native speech runtimes
        env:
          ETERX_WHISPER_BUILD_FROM_SOURCE: ${{ matrix.target == 'win' }}
        run: npm run desktop:prepare-whisper

      - name: Compile application
        run: npm run build

      - name: Prepare self-contained desktop runtime
        env:
          ETERX_POSTHOG_PROJECT_TOKEN: ${{ secrets.ETERX_POSTHOG_PROJECT_TOKEN }}
          ETERX_POSTHOG_HOST: ${{ vars.ETERX_POSTHOG_HOST }}
        run: npm run desktop:prepare-runtime

      - name: Package Windows
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          }
          for ($attempt = 1; $attempt -le 4; $attempt += 1) {
            $logPath = Join-Path $env:RUNNER_TEMP "electron-builder-win-$attempt.log"
            & npx electron-builder --win --x64 --arm64 --publish never 2>&1 | Tee-Object -FilePath $logPath
            $buildExit = $LASTEXITCODE
            if ($buildExit -eq 0) { break }
            $transientDownloadFailure = Select-String -Path $logPath -Pattern 'Response code (408|425|429|5\d\d)|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ECONNREFUSED|ENETUNREACH|ENOTFOUND|UND_ERR_CONNECT_TIMEOUT' -Quiet
            if (-not $transientDownloadFailure -or $attempt -eq 4) { exit $buildExit }
            Start-Sleep -Seconds (5 * $attempt)
          }

      - name: Package macOS
        if: matrix.target == 'mac'
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          # Hosted macOS runners can intermittently fail electron-builder's
          # APFS DMG resize step with `hdiutil ... Device not configured (6)`.
          # The public updater consumes ZIP artifacts, so build only the stable
          # ZIP target here and avoid the fragile DMG image path entirely.
          run_with_download_retries() {
            local attempt=1
            local log_file
            local build_status
            while [ "$attempt" -le 4 ]; do
              log_file="$RUNNER_TEMP/electron-builder-mac-$attempt.log"
              set +e
              npx electron-builder --mac zip --x64 --arm64 --publish never 2>&1 | tee "$log_file"
              build_status=${PIPESTATUS[0]}
              set -e
              if [ "$build_status" -eq 0 ]; then return 0; fi
              if ! grep -Eiq 'Response code (408|425|429|5[0-9]{2})|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ECONNREFUSED|ENETUNREACH|ENOTFOUND|UND_ERR_CONNECT_TIMEOUT' "$log_file" || [ "$attempt" -eq 4 ]; then
                return "$build_status"
              fi
              sleep "$((5 * attempt))"
              attempt=$((attempt + 1))
            done
          }
          run_with_download_retries

      - name: Prepare Linux AppImage tool cache
        if: matrix.target == 'linux'
        run: |
          set -euo pipefail
          builder_cache="$RUNNER_TEMP/eterx-electron-builder-cache"
          release_dir="$builder_cache/appimage-12.0.1"
          archive="$release_dir/appimage-12.0.1.7z"
          mkdir -p "$release_dir"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 180 --max-time 300 \
            "${ELECTRON_BUILDER_BINARIES_MIRROR%/}/appimage-12.0.1/appimage-12.0.1.7z" \
            --output "$archive"
          printf '%s  %s\n' \
            'd12ff7eb8f1d1ec4652ca5237a7fbdca33acc0c758045636feca62dc6ecb8ec4' "$archive" \
            | sha256sum --check --status
          echo "ELECTRON_BUILDER_CACHE=$builder_cache" >> "$GITHUB_ENV"

      - name: Package Linux
        if: matrix.target == 'linux'
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          # The public installer and in-app updater use AppImage. Keep the
          # release path deterministic by avoiding electron-builder's
          # optional multi-arch Debian/fpm packaging, which can fail after
          # both AppImages have already been built successfully.
          run_with_download_retries() {
            local attempt=1
            local log_file
            local build_status
            while [ "$attempt" -le 4 ]; do
              log_file="$RUNNER_TEMP/electron-builder-linux-$attempt.log"
              set +e
              npx electron-builder --linux AppImage --x64 --arm64 --publish never 2>&1 | tee "$log_file"
              build_status=${PIPESTATUS[0]}
              set -e
              if [ "$build_status" -eq 0 ]; then return 0; fi
              if ! grep -Eiq 'Response code (408|425|429|5[0-9]{2})|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ECONNREFUSED|ENETUNREACH|ENOTFOUND|UND_ERR_CONNECT_TIMEOUT' "$log_file" || [ "$attempt" -eq 4 ]; then
                return "$build_status"
              fi
              sleep "$((5 * attempt))"
              attempt=$((attempt + 1))
            done
          }
          run_with_download_retries

      - name: Include Linux launcher icon
        if: matrix.target == 'linux'
        run: cp public/logo.png dist/eterx-icon-512.png

      - name: Verify packaged runtime contents
        run: node scripts/verify-packaged-runtime.mjs dist

      - name: Boot packaged runtime
        run: node scripts/smoke-packaged-runtime.mjs dist

      - name: Upload native artifacts to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "${{ matrix.target }}" in
            win)
              required_patterns=(dist/latest.yml 'dist/EterX-*-win-x64.exe' 'dist/EterX-*-win-arm64.exe')
              files=(dist/EterX-*.exe dist/EterX-*.blockmap dist/latest.yml)
              ;;
            mac)
              required_patterns=(dist/latest-mac.yml 'dist/EterX-*-mac-x64.zip' 'dist/EterX-*-mac-arm64.zip')
              files=(dist/EterX-*.dmg dist/EterX-*.zip dist/EterX-*.zip.blockmap dist/latest-mac.yml)
              ;;
            linux)
              # electron-updater requests latest-linux.yml on x64 and an
              # architecture-suffixed file such as latest-linux-arm64.yml on
              # ARM64. Electron-builder uses "x86_64" (not "x64") in the
              # x64 AppImage filename. Validate both architectures by their
              # actual output names, then upload every generated Linux file.
              required_patterns=(dist/latest-linux.yml dist/latest-linux-arm64.yml)
              files=(dist/EterX-*.AppImage dist/latest-linux*.yml)
              ;;
          esac
          for pattern in "${required_patterns[@]}"; do
            if ! compgen -G "$pattern" >/dev/null; then
              echo "Required release asset is missing: $pattern" >&2
              exit 1
            fi
          done
          if [ "${{ matrix.target }}" = "linux" ]; then
            linux_appimages=(dist/EterX-*.AppImage)
            has_linux_x64=false
            has_linux_arm64=false
            for asset in "${linux_appimages[@]}"; do
              case "$asset" in
                *-arm64.AppImage) has_linux_arm64=true ;;
                *-x64.AppImage|*-x86_64.AppImage) has_linux_x64=true ;;
              esac
            done
            if [ "$has_linux_x64" != true ] || [ "$has_linux_arm64" != true ]; then
              echo "Expected x64 and arm64 Linux AppImages; found: ${linux_appimages[*]:-none}" >&2
              exit 1
            fi
          fi
          if [ "${{ matrix.target }}" = "linux" ] && [ -f dist/eterx-icon-512.png ]; then
            files+=(dist/eterx-icon-512.png)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No native release files were produced." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish:
    name: Publish verified release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          release_id="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json databaseId,isDraft --jq 'select(.isDraft) | .databaseId')"
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Expected a draft release for $RELEASE_TAG." >&2
            exit 1
          fi

          assets="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            | jq -cs 'add | map(select(.name != "SHA256SUMS.txt"))')"
          if ! jq -e 'length > 0 and all(.[]; .state == "uploaded" and .size > 0)' <<< "$assets" >/dev/null; then
            echo "The draft release has missing or incomplete assets." >&2
            exit 1
          fi

          # GitHub hashes the uploaded bytes. Reuse those digests instead of
          # downloading the installers again, with a fallback if unavailable.
          if jq -er '
            select(all(.[]; (.digest // "") | test("^sha256:[a-f0-9]{64}$")))
            | sort_by(.name)[] | "\(.digest[7:])  \(.name)"
          ' <<< "$assets" > "$RUNNER_TEMP/eterx-checksums.txt"; then
            mv "$RUNNER_TEMP/eterx-checksums.txt" release/SHA256SUMS.txt
          else
            echo "Asset digests unavailable; downloading assets to calculate checksums."
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release
            cd release
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #' > SHA256SUMS.txt
          fi

      - name: Upload checksum and publish release
        run: |
          gh release upload "$RELEASE_TAG" release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --title "EterX $RELEASE_TAG"

      - name: Verify the public updater feed
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          for asset in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml SHA256SUMS.txt; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$asset"
            destination="release/public-$asset"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 5 --retry-all-errors \
              "$url" --output "$destination"
            if [[ "$asset" == latest*.yml ]] && ! grep -Fq "version: $expected_version" "$destination"; then
              echo "$asset does not advertise EterX $expected_version" >&2
              exit 1
            fi
          done
