name: Native release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: eterx-release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tests
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --fund=false

      - name: Run release checks
        run: npm run test:ci

  prepare-release:
    name: Prepare draft release
    needs: verify
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Require a public updater host
        shell: bash
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.visibility // (if .private then "private" else "public" end)')"
          visibility="$(printf '%s' "$visibility" | tr '[:upper:]' '[:lower:]')"
          if [ "$visibility" != "public" ]; then
            echo "EterX desktop clients use an unauthenticated GitHub Releases feed; repository visibility is $visibility, not PUBLIC." >&2
            exit 1
          fi

      - name: Create or reset draft release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "Release $RELEASE_TAG already exists and is published; published releases are immutable." >&2
              exit 1
            fi
            while IFS= read -r asset; do
              [ -z "$asset" ] || gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "EterX $RELEASE_TAG" \
              --notes "Verified native EterX installers are being built."
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            target: win
            runtime_targets: win32:x64,win32:arm64
          - platform: macOS
            runner: macos-14
            target: mac
            runtime_targets: darwin:x64,darwin:arm64
          - platform: Linux
            runner: ubuntu-22.04
            target: linux
            runtime_targets: linux:x64,linux:arm64
    runs-on: ${{ matrix.runner }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      # Public releases are intentionally unsigned. Keep electron-builder from
      # auto-discovering a developer certificate on hosted runners.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ETERX_RUNTIME_TARGETS: ${{ matrix.runtime_targets }}

    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Enforce release version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match tag $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$LOCK_VERSION" != "$TAG_VERSION" ]; then
            echo "package-lock.json version $LOCK_VERSION does not match tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --fund=false

      - name: Compile application
        run: npm run desktop:prepare-whisper && npm run build

      - name: Install Linux ARM64 terminal toolchain
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Prepare self-contained desktop runtime
        run: npm run desktop:prepare-runtime

      - name: Package Windows
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          }
          npx electron-builder --win --x64 --arm64 --publish never

      - name: Package macOS
        if: matrix.target == 'mac'
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          # Hosted macOS runners can intermittently fail electron-builder's
          # APFS DMG resize step with `hdiutil ... Device not configured (6)`.
          # The public updater consumes ZIP artifacts, so build only the stable
          # ZIP target here and avoid the fragile DMG image path entirely.
          npx electron-builder --mac zip --x64 --arm64 --publish never

      - name: Package Linux
        if: matrix.target == 'linux'
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          # The public installer and in-app updater use AppImage. Keep the
          # release path deterministic by avoiding electron-builder's
          # optional multi-arch Debian/fpm packaging, which can fail after
          # both AppImages have already been built successfully.
          npx electron-builder --linux AppImage --x64 --arm64 --publish never

      - name: Include Linux launcher icon
        if: matrix.target == 'linux'
        run: cp public/logo.png dist/eterx-icon-512.png

      - name: Verify packaged runtime contents
        run: node scripts/verify-packaged-runtime.mjs dist

      - name: Boot packaged runtime
        run: node scripts/smoke-packaged-runtime.mjs dist

      - name: Upload native artifacts to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "${{ matrix.target }}" in
            win)
              required_patterns=(dist/latest.yml 'dist/EterX-*-win-x64.exe' 'dist/EterX-*-win-arm64.exe')
              files=(dist/EterX-*.exe dist/EterX-*.blockmap dist/latest.yml)
              ;;
            mac)
              required_patterns=(dist/latest-mac.yml 'dist/EterX-*-mac-x64.zip' 'dist/EterX-*-mac-arm64.zip')
              files=(dist/EterX-*.dmg dist/EterX-*.zip dist/latest-mac.yml)
              ;;
            linux)
              # electron-updater requests latest-linux.yml on x64 and an
              # architecture-suffixed file such as latest-linux-arm64.yml on
              # ARM64. Electron-builder uses "x86_64" (not "x64") in the
              # x64 AppImage filename. Validate both architectures by their
              # actual output names, then upload every generated Linux file.
              required_patterns=(dist/latest-linux.yml dist/latest-linux-arm64.yml)
              files=(dist/EterX-*.AppImage dist/latest-linux*.yml)
              ;;
          esac
          for pattern in "${required_patterns[@]}"; do
            if ! compgen -G "$pattern" >/dev/null; then
              echo "Required release asset is missing: $pattern" >&2
              exit 1
            fi
          done
          if [ "${{ matrix.target }}" = "linux" ]; then
            linux_appimages=(dist/EterX-*.AppImage)
            has_linux_x64=false
            has_linux_arm64=false
            for asset in "${linux_appimages[@]}"; do
              case "$asset" in
                *-arm64.AppImage) has_linux_arm64=true ;;
                *-x64.AppImage|*-x86_64.AppImage) has_linux_x64=true ;;
              esac
            done
            if [ "$has_linux_x64" != true ] || [ "$has_linux_arm64" != true ]; then
              echo "Expected x64 and arm64 Linux AppImages; found: ${linux_appimages[*]:-none}" >&2
              exit 1
            fi
          fi
          if [ "${{ matrix.target }}" = "linux" ] && [ -f dist/eterx-icon-512.png ]; then
            files+=(dist/eterx-icon-512.png)
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No native release files were produced." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Download packaged release assets
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release

      - name: Generate SHA-256 manifest
        working-directory: release
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt

      - name: Upload checksum and publish release
        run: |
          gh release upload "$RELEASE_TAG" release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --title "EterX $RELEASE_TAG"

      - name: Verify the public updater feed
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          for asset in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml SHA256SUMS.txt; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$asset"
            destination="release/public-$asset"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 5 --retry-all-errors \
              "$url" --output "$destination"
            if [[ "$asset" == latest*.yml ]] && ! grep -Fq "version: $expected_version" "$destination"; then
              echo "$asset does not advertise EterX $expected_version" >&2
              exit 1
            fi
          done
