name: Native release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: eterx-release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            target: win
            runtime_targets: win32:x64,win32:arm64
          - platform: macOS
            runner: macos-14
            target: mac
            runtime_targets: darwin:x64,darwin:arm64
          - platform: Linux
            runner: ubuntu-22.04
            target: linux
            runtime_targets: linux:x64,linux:arm64
    runs-on: ${{ matrix.runner }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CSC_LINK: ${{ matrix.target == 'win' && secrets.WINDOWS_CSC_LINK || secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.target == 'win' && secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ETERX_RUNTIME_TARGETS: ${{ matrix.runtime_targets }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Enforce release version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --fund=false

      - name: Compile application
        run: npm run build

      - name: Prepare self-contained desktop runtime
        run: npm run desktop:prepare-runtime

      - name: Package Windows
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          }
          npx electron-builder --win --x64 --arm64 --publish never

      - name: Package macOS
        if: matrix.target == 'mac'
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [ -z "${APPLE_ID:-}" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder --mac --x64 --arm64 --publish never

      - name: Package Linux
        if: matrix.target == 'linux'
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder --linux --x64 --arm64 --publish never

      - name: Include Linux launcher icon
        if: matrix.target == 'linux'
        run: cp public/logo-whitetheme.png dist/eterx-icon-512.png

      - name: Verify packaged runtime contents
        run: node scripts/verify-packaged-runtime.mjs dist

      - name: Boot packaged runtime
        run: node scripts/smoke-packaged-runtime.mjs dist

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EterX-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            dist/*.yaml
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/eterx-icon-512.png
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: EterX-*
          path: release
          merge-multiple: true

      - name: Generate SHA-256 manifest
        working-directory: release
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS.txt

      - name: Publish immutable GitHub release assets
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; published versions are immutable." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "EterX $RELEASE_TAG"
